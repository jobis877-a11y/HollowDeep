<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hollowdeep">
<meta name="theme-color" content="#0f0c14">
<title>Hollowdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first. Map screen = header / tile canvas / party bar. Battle screen = stage canvas / log / party cards / command panel. Single deliberate theme: a torchlit dungeon. */
:root{
  --bg:#0f0c14; --panel:#1c1724; --panel2:#251e30; --line:#3a3047; --ink:#f1e9da; --dim:#a597b5;
  --gold:#f2c14e; --hp:#e2475b; --mp:#4fa3ff; --xp:#8be07a; --fire:#ff7a3d; --frost:#7fd6ff; --holy:#ffe58a;
  --f:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--f);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(var(--bg),rgba(15,12,20,.6))}
.floorlbl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.floorlbl b{display:block;font-size:20px;letter-spacing:.02em;color:var(--ink);text-transform:none}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.ibtn:active{transform:scale(.97)}
#mapWrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;color:var(--dim);background:rgba(15,12,20,.75);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}

.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;gap:3px;min-width:0;text-align:left;position:relative}
.pc.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(242,193,78,.3)}
.pc.dead{opacity:.45}
.pc.target{border-color:var(--xp);box-shadow:0 0 0 1px var(--xp)}
.pc .nm{display:flex;justify-content:space-between;gap:4px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.pc .nm span:last-child{color:var(--dim);font-weight:400}
.bar{height:6px;border-radius:3px;background:#0b0910;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)}
.num{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.st{position:absolute;top:-7px;right:6px;display:flex;gap:3px}
.st span{font-size:9px;padding:1px 4px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}

/* battle */
#battle{z-index:5;background:var(--bg)}
#stage{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.log{min-height:40px;padding:8px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));font-size:14px;line-height:1.35;color:var(--ink);border-top:1px solid var(--line);background:var(--panel)}
.log em{font-style:normal;color:var(--gold)}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));background:var(--panel);min-height:66px}
.cmd{background:linear-gradient(180deg,#352a44,#261f31);border:1px solid #4b3d5c;border-radius:10px;padding:12px 4px;font-size:15px;font-weight:600}
.cmd:disabled{opacity:.4}
.cmd.wide{grid-column:span 2}
.cmd small{display:block;font-size:11px;font-weight:400;color:var(--mp)}
.cmd .el{font-size:10px}
.sub{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sub .cmd{text-align:left;padding:9px 10px}
.sub .cmd span{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px;line-height:1.3}
.prompt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--xp)}

/* modal */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,3,8,.72);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:100%;max-width:360px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0;font-size:22px;color:var(--gold)}
.dlg p{margin:0;line-height:1.45;color:var(--ink)}
.dlg .muted{color:var(--dim);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;background:linear-gradient(180deg,var(--gold),#c98f23);color:#1d1204;border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:var(--panel2);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--dim)}
.stats b{display:block;font-size:17px;color:var(--ink)}
.portrait{width:72px;height:72px;flex:none}

/* title */
#title{z-index:8;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 40%,#2a1d36,var(--bg) 70%)}
#title canvas{width:min(420px,92vw);height:auto}
#title h1{margin:0;font-size:clamp(48px,15vw,72px);line-height:.9;color:var(--gold);text-shadow:0 4px 0 #6b3f12,0 0 30px rgba(242,193,78,.35);letter-spacing:.02em}
#title p{margin:0;color:var(--dim);max-width:300px;line-height:1.4}
#title .btns{flex-direction:column;width:min(260px,80vw)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:12;background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (min-width:700px){ .party,.cmds,.log,.top{padding-left:max(14px,calc(50vw - 300px));padding-right:max(14px,calc(50vw - 300px))} }
</style>
</head>
<body>

<!-- Title -->
<div class="screen" id="title">
  <canvas id="titleArt" width="600" height="320" aria-hidden="true"></canvas>
  <h1>Hollowdeep</h1>
  <p>Five floors down, the Hollow King waits on his bone throne. Take three heroes and bring back the light.</p>
  <div class="btns">
    <button class="btn" id="continueBtn" hidden>Continue</button>
    <button class="btn" id="newBtn">New adventure</button>
    <button class="btn ghost" id="titleSound">Sound settings</button>
  </div>
  <p class="muted" style="font-size:12px">Tap a tile to walk. Touch a monster to fight.</p>
</div>

<!-- Map -->
<div class="screen" id="explore" hidden>
  <div class="top">
    <div class="floorlbl">Depth<b id="floorName">Floor 1</b></div>
    <div class="chips">
      <div class="chip"><i></i><span id="gold">0</span></div>
      <button class="ibtn" id="soundBtn" aria-label="Sound settings">Sound</button>
      <button class="ibtn" id="bagBtn">Bag</button>
    </div>
  </div>
  <div id="mapWrap"><canvas id="map" aria-label="Dungeon map"></canvas><div class="hint" id="hint">Tap a tile to walk there</div></div>
  <div class="party" id="partyBar"></div>
</div>

<!-- Battle -->
<div class="screen" id="battle" hidden>
  <canvas id="stage" aria-label="Battle"></canvas>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="party" id="bParty" style="padding-bottom:8px;border-top:0"></div>
  <div class="cmds" id="cmds"></div>
</div>

<div class="modal" id="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const rnd = (a,b) => a + Math.random()*(b-a), ri = (a,b) => Math.floor(rnd(a,b+1)), pick = a => a[Math.floor(Math.random()*a.length)];
const TAU = Math.PI*2, SAVE = "hd.save.v1";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= DATA ================= */
const CLASSES = {
  warden:   { name:"Warden",     role:"Shieldbearer", col:"#4f7fe0", base:{hp:34,mp:8, atk:7,mag:2,def:5,spd:4}, grow:{hp:7,mp:1,atk:2,mag:0,def:1.2,spd:.3}, skills:[["taunt",1],["cleave",3],["bulwark",5]] },
  arcanist: { name:"Arcanist",   role:"Spellcaster",  col:"#a46cf0", base:{hp:20,mp:18,atk:3,mag:9,def:2,spd:6}, grow:{hp:3.5,mp:3,atk:.5,mag:2.2,def:.6,spd:.4}, skills:[["firebolt",1],["frost",1],["fireball",3],["starfall",5]] },
  light:    { name:"Lightbearer",role:"Healer",       col:"#f2c14e", base:{hp:26,mp:16,atk:5,mag:6,def:3,spd:5}, grow:{hp:5,mp:2.6,atk:1,mag:1.6,def:.9,spd:.3}, skills:[["mend",1],["smite",1],["radiance",3],["revive",4]] }
};
const SKILLS = {
  taunt:   { name:"Taunt",    mp:2, tgt:"self",  desc:"Enemies attack you for 2 turns. +3 DEF." },
  cleave:  { name:"Cleave",   mp:4, tgt:"enemies", desc:"Strike every enemy." },
  bulwark: { name:"Bulwark",  mp:6, tgt:"self",  desc:"Party takes half damage this round." },
  firebolt:{ name:"Firebolt", mp:3, tgt:"enemy", el:"fire",  desc:"Fire damage. May burn." },
  frost:   { name:"Frost Lance", mp:4, tgt:"enemy", el:"frost", desc:"Ice damage. May freeze." },
  fireball:{ name:"Fireball", mp:7, tgt:"enemies", el:"fire", desc:"Fire on every enemy." },
  starfall:{ name:"Starfall", mp:11, tgt:"enemies", el:"holy", desc:"Heavy holy damage to all." },
  mend:    { name:"Mend",     mp:3, tgt:"ally",  desc:"Heal one ally." },
  smite:   { name:"Smite",    mp:3, tgt:"enemy", el:"holy", desc:"Holy damage. Crushes undead." },
  radiance:{ name:"Radiance", mp:7, tgt:"allies", desc:"Heal the whole party." },
  revive:  { name:"Revive",   mp:8, tgt:"fallen", desc:"Raise a fallen ally at half HP." }
};
const ITEMS = {
  potion:{ name:"Potion",       price:15, tgt:"ally",   desc:"Restore 30 HP." },
  ether: { name:"Ether",        price:20, tgt:"ally",   desc:"Restore 12 MP." },
  feather:{ name:"Ember Feather",price:55, tgt:"fallen", desc:"Revive an ally at half HP." },
  bomb:  { name:"Flash Bomb",   price:25, tgt:"enemies",desc:"18 fire damage to all enemies." }
};
const GEAR = {
  warden:   [["Iron Blade",2],["Runed Axe",4],["Oathkeeper",7],["Dawnbreaker",10]],
  arcanist: [["Ash Staff",2],["Starglass Rod",4],["Void Scepter",7],["Crown of Embers",10]],
  light:    [["Oak Mace",2],["Sunlit Censer",4],["Halo Lantern",7],["Saint's Bell",10]]
};
const ARMOR = [["Padded Coat",1],["Chainmail",2],["Wardplate",3],["Moonsteel",5]];
const FOES = {
  gnawling: { name:"Gnawling",     hp:11, atk:4, mag:0, def:1, spd:7, xp:5,  gold:[2,6] },
  duskwing: { name:"Duskwing",     hp:13, atk:5, mag:0, def:1, spd:9, xp:6,  gold:[2,7], weak:"frost" },
  boggart:  { name:"Boggart",      hp:17, atk:6, mag:0, def:2, spd:5, xp:8,  gold:[4,10], weak:"fire" },
  ooze:     { name:"Ooze",         hp:24, atk:4, mag:0, def:1, spd:3, xp:9,  gold:[3,8],  weak:"fire", poison:true },
  bone:     { name:"Bonewalker",   hp:22, atk:7, mag:0, def:4, spd:4, xp:11, gold:[5,12], weak:"holy", undead:true },
  acolyte:  { name:"Hollow Acolyte",hp:20, atk:4, mag:7, def:2, spd:6, xp:13, gold:[8,16], weak:"holy", caster:true },
  sentinel: { name:"Stone Sentinel",hp:40, atk:9, mag:0, def:7, spd:3, xp:18, gold:[10,20], weak:"frost" },
  king:     { name:"The Hollow King",hp:190,atk:11,mag:11,def:6, spd:6, xp:0,  gold:[0,0],  weak:"holy", undead:true, boss:true }
};
const POOLS = { 1:["gnawling","duskwing","boggart"], 2:["boggart","ooze","bone","duskwing"], 3:["bone","acolyte","ooze","boggart"], 4:["acolyte","sentinel","bone","duskwing"], 5:["sentinel","acolyte","bone"] };

/* ================= STATE ================= */
let G = null;   // whole game save
function newHero(cls){ const c = CLASSES[cls], b = c.base; return { cls, name:c.name, lv:1, xp:0, maxHp:b.hp, hp:b.hp, maxMp:b.mp, mp:b.mp, atk:b.atk, mag:b.mag, def:b.def, spd:b.spd, wpn:null, arm:null }; }
function newGame(){
  G = { floor:1, gold:20, bag:{ potion:3, ether:1, feather:1, bomb:0 }, heroes:[newHero("warden"), newHero("arcanist"), newHero("light")], map:null, stats:{ kills:0, steps:0 } };
  G.map = genFloor(1); save();
}
function save(){ if (G) store.set(SAVE, G); }
const xpNeed = lv => Math.round(18 * Math.pow(lv, 1.55));
const eff = h => ({ atk: h.atk + (h.wpn && h.cls==="warden" ? h.wpn[1] : 0), mag: h.mag + (h.wpn && h.cls!=="warden" ? h.wpn[1] : 0), def: h.def + (h.arm ? h.arm[1] : 0) });

/* ================= MAP GENERATION ================= */
const MW = 11, MH = 15;
function genFloor(f){
  for (let attempt=0; attempt<40; attempt++){
    const g = Array.from({length:MH}, () => Array(MW).fill(1)), rooms = [];
    for (let i=0;i<60 && rooms.length < 6;i++){
      const w = ri(3,5), h = ri(3,4), x = ri(1, MW-w-1), y = ri(1, MH-h-1);
      if (rooms.some(r => x < r.x+r.w+1 && x+w+1 > r.x && y < r.y+r.h+1 && y+h+1 > r.y)) continue;
      rooms.push({x,y,w,h, cx: x + (w>>1), cy: y + (h>>1)});
    }
    if (rooms.length < 4) continue;
    rooms.sort((a,b) => a.cy - b.cy || a.cx - b.cx);
    for (const r of rooms) for (let y=r.y;y<r.y+r.h;y++) for (let x=r.x;x<r.x+r.w;x++) g[y][x] = 0;
    for (let i=1;i<rooms.length;i++){ const a = rooms[i-1], b = rooms[i]; carve(g, a.cx, a.cy, b.cx, b.cy); }
    if (rooms.length > 4) carve(g, rooms[0].cx, rooms[0].cy, rooms[rooms.length-1].cx, rooms[rooms.length-1].cy);
    const start = rooms[rooms.length-1], dist = bfsDist(g, start.cx, start.cy);
    let far = rooms[0]; for (const r of rooms) if (dist[r.cy][r.cx] > dist[far.cy][far.cx]) far = r;
    const ents = [], used = new Set([start.cx+","+start.cy]);
    const put = (type, r, extra={}) => { for (let k=0;k<30;k++){ const x = ri(r.x, r.x+r.w-1), y = ri(r.y, r.y+r.h-1), key = x+","+y; if (!used.has(key)) { used.add(key); const e = Object.assign({ id: Math.random().toString(36).slice(2,8), type, x, y }, extra); ents.push(e); return e; } } };
    put(f === 5 ? "boss" : "stairs", far, f === 5 ? { group:["king"] } : {});
    const others = rooms.filter(r => r !== start);
    const nFoes = Math.min(8, 3 + f);
    for (let i=0;i<nFoes;i++){ const pool = POOLS[f], n = f===1 ? ri(1,2) : ri(1,3); put("foe", pick(others), { group: Array.from({length:n}, () => pick(pool)) }); }
    for (let i=0;i<2 + (f>2?1:0);i++) put("chest", pick(rooms.filter(r=>r!==start) ));
    if (f === 2 || f === 4) put("shrine", pick(others));
    if (f === 3 || f === 5) put("merchant", pick(others.filter(r=>r!==far)) || start);
    /* light torches on walls that face floor */
    const torches = [];
    for (let y=1;y<MH;y++) for (let x=0;x<MW;x++) if (g[y][x]===1 && y+1<MH && g[y+1][x]===0 && Math.random()<.16) torches.push([x,y]);
    return { grid:g, ents, torches, seen: Array.from({length:MH}, () => Array(MW).fill(0)), px:start.cx, py:start.cy, start:[start.cx, start.cy], rooms: rooms.map(r => [r.x, r.y, r.w, r.h]) };
  }
}
function carve(g, x1, y1, x2, y2){
  let x = x1, y = y1; const horizFirst = Math.random() < .5;
  const stepX = () => { while (x !== x2) { g[y][x] = 0; x += Math.sign(x2-x); } };
  const stepY = () => { while (y !== y2) { g[y][x] = 0; y += Math.sign(y2-y); } };
  if (horizFirst) { stepX(); stepY(); } else { stepY(); stepX(); } g[y][x] = 0;
}
function bfsDist(g, sx, sy){
  const d = Array.from({length:MH}, () => Array(MW).fill(1e9)), q = [[sx,sy]]; d[sy][sx] = 0;
  while (q.length){ const [x,y] = q.shift(); for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx=x+dx, ny=y+dy; if (nx>=0&&ny>=0&&nx<MW&&ny<MH&&g[ny][nx]===0&&d[ny][nx]>d[y][x]+1){ d[ny][nx]=d[y][x]+1; q.push([nx,ny]); } } }
  return d;
}
function path(g, sx, sy, tx, ty, seen){
  const prev = {}, q = [[sx,sy]], key = (x,y) => x+","+y; prev[key(sx,sy)] = null;
  while (q.length){ const [x,y] = q.shift(); if (x===tx && y===ty) break;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx=x+dx, ny=y+dy, k=key(nx,ny); if (nx<0||ny<0||nx>=MW||ny>=MH||g[ny][nx]!==0||k in prev) continue; if (!seen[ny][nx] && !(nx===tx&&ny===ty)) continue; prev[k] = [x,y]; q.push([nx,ny]); } }
  if (!(key(tx,ty) in prev)) return null;
  const out = []; let c = [tx,ty]; while (c && !(c[0]===sx && c[1]===sy)) { out.unshift(c); c = prev[key(c[0],c[1])]; } return out;
}
function reveal(m){
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++) if (Math.hypot(x-m.px, y-m.py) <= 2.6) m.seen[y][x] = 1;
  for (const [rx,ry,rw,rh] of (m.rooms||[])) if (m.px >= rx && m.px < rx+rw && m.py >= ry && m.py < ry+rh)
    for (let y=Math.max(0,ry-1); y<Math.min(MH,ry+rh+1); y++) for (let x=Math.max(0,rx-1); x<Math.min(MW,rx+rw+1); x++) m.seen[y][x] = 1;
}

/* ================= SPRITES (original, drawn with paths) ================= */
function sprite(c, kind, x, y, s, t=0, o={}){
  c.save(); c.translate(x, y); if (o.flip) c.scale(-1,1);

    u.shake = Math.max(0, u.shake - dt); const sh = u.shake > 0 && !still ? Math.sin(T*80)*6*u.shake/.35 : 0;
    c.globalAlpha = u.hp <= 0 ? .35 : 1;
    if (B.cur === u && u.hp > 0) { c.fillStyle = "rgba(242,193,78,.25)"; c.beginPath(); c.ellipse(u.x, u.y + u.s*.46, u.s*.42, u.s*.1, 0, 0, TAU); c.fill(); }
    if (B.mode === "tgt-enemy" && u.side === "foe") { c.strokeStyle = `rgba(139,224,122,${.6+.3*Math.sin(T*8)})`; c.lineWidth = 2; c.beginPath(); c.ellipse(u.x, u.y + u.s*.46, u.s*.42, u.s*.12, 0, 0, TAU); c.stroke(); }
    sprite(c, u.kind, u.x + sh, u.y, u.s, T, { ph:u.ph||0, flip: u.side==="foe" && u.kind!=="king" ? false : false });
    if (u.side === "hero" && u.hp <= 0) { c.fillStyle = "#a597b5"; c.font = "600 12px Pixelify Sans, sans-serif"; c.textAlign = "center"; c.fillText("FALLEN", u.x, u.y - u.s*.55); }
    c.globalAlpha = 1;
    if (u.side === "foe") { const w = Math.min(90, u.s*.8), x0 = u.x - w/2, y0 = Math.max(30, u.y - u.s*(u.data.boss ? .74 : .62));
      c.fillStyle = "#0b0910"; c.fillRect(x0, y0, w, 6); c.fillStyle = "#e2475b"; c.fillRect(x0, y0, w*Math.max(0,u.hp)/u.maxHp, 6);
      c.fillStyle = "#f1e9da"; c.font = "600 12px Pixelify Sans, sans-serif"; c.textAlign = "center"; c.fillText(u.name + (u.st.burn ? " · burn" : "") + (u.st.frozen ? " · frozen" : ""), u.x, y0 - 5);
      if (u.data.weak && B.mode === "tgt-enemy") { c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--"+u.data.weak); c.font = "11px Pixelify Sans, sans-serif"; c.fillText("weak: " + u.data.weak, u.x, y0 + 18); } }
  }
  for (const f of B.fx) { f.life -= dt;
    if (f.poof) { c.globalAlpha = Math.max(0, f.life/.7); c.fillStyle = "#cfc8db"; for (let i=0;i<8;i++){ const a = i/8*TAU, r = (1-f.life/.7)*50; c.beginPath(); c.arc(f.x + Math.cos(a)*r, f.y + Math.sin(a)*r*.6, 6*(f.life/.7)+1, 0, TAU); c.fill(); } }
    else { c.globalAlpha = Math.min(1, f.life*2); c.fillStyle = f.col; c.font = `700 ${f.tag?22:19}px Pixelify Sans, sans-serif`; c.textAlign = "center"; const yy = f.y - (1.1 - f.life)*40;
      c.strokeStyle = "#0b0910"; c.lineWidth = 4; c.strokeText(f.text, f.x, yy); c.fillText(f.text, f.x, yy);
      if (f.tag) { c.font = "700 12px Pixelify Sans, sans-serif"; c.fillStyle = f.tag==="CRIT" ? "#f2c14e" : "#8be07a"; c.strokeText(f.tag, f.x, yy - 20); c.fillText(f.tag, f.x, yy - 20); } }
  }
  c.globalAlpha = 1; B.fx = B.fx.filter(f => f.life > 0);
}

/* ================= FLOW ================= */
function enterExplore(){
  $("title").hidden = true; $("battle").hidden = true; $("explore").hidden = false;
  sizeMap(); startOf(G.map); reveal(G.map); renderPartyBar(); music.play(G.floor === 5 ? "throne" : "explore");
  $("hint").hidden = G.stats.steps > 6;
}
function showTitle(){
  $("explore").hidden = true; $("battle").hidden = true; $("title").hidden = false;
  music.play("explore"); const has = !!store.get(SAVE, null); $("continueBtn").hidden = !has;
  $("newBtn").textContent = has ? "New adventure" : "Begin";
}
$("newBtn").onclick = () => { audio(); if (store.get(SAVE,null)) modal(`<h3>Start over?</h3><p>Your current adventure will be lost.</p>`, [{ label:"Start over", fn:() => { newGame(); enterExplore(); } }, { label:"Cancel", ghost:true }]); else { newGame(); enterExplore(); } };
$("continueBtn").onclick = () => { audio(); G = store.get(SAVE, null); if (!G) return showTitle(); enterExplore(); };
$("bagBtn").onclick = () => { audio(); bagView(); };
$("soundBtn").onclick = soundMenu; $("titleSound").onclick = soundMenu;

/* title art: the party facing the king */
function drawTitle(){ const c = $("titleArt").getContext("2d"); c.clearRect(0,0,600,320);
  const g = c.createRadialGradient(300,170,10,300,170,230); g.addColorStop(0,"rgba(199,107,255,.25)"); g.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle = g; c.fillRect(0,0,600,300);
  sprite(c,"king",480,150,250,T); sprite(c,"bone",355,200,140,T,{ph:1}); sprite(c,"warden",155,195,170,T); sprite(c,"arcanist",60,205,150,T,{ph:1}); sprite(c,"light",250,210,150,T,{ph:2}); }

let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; T += dt;
  if (!$("title").hidden) drawTitle();
  if (!$("explore").hidden) drawMap();
  if (!$("battle").hidden) drawStage(dt);
  requestAnimationFrame(loop);
}
addEventListener("resize", () => { if (!$("explore").hidden) sizeMap(); if (!$("battle").hidden) { sizeStage(); layoutUnits(); } });
showTitle(); requestAnimationFrame(loop);
})();
</script>
